name: Phase 1B fixed ensembles

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/run_phase1b.py"
      - "src/**"
      - "config/**"
      - "tickers/**"
      - "docs/PHASE1B_PROTOCOL.txt"

jobs:
  phase1b:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python scripts/run_phase1b.py
      - uses: actions/upload-artifact@v4
        with:
          name: phase1b-development
          path: reports/phase1b_results.csv
            reports/phase1b_walkforward.csv
          if-no-files-found: error
          retention-days: 30
