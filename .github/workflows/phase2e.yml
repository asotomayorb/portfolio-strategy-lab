name: Phase 2E robustness suite

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/run_phase2e.py"
      - "scripts/run_phase2a.py"
      - "src/data_loader.py"
      - "tickers/**"
      - "portfolio_allocation.csv"
      - "docs/PHASE2E_PROTOCOL.txt"

jobs:
  phase2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python scripts/run_phase2e.py
      - uses: actions/upload-artifact@v4
        with:
          name: phase2e-robustness
          path: reports/phase2e/**
          if-no-files-found: error
          retention-days: 30
