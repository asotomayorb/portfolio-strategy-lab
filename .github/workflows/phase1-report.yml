name: phase1-report

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python scripts/run_phase1.py --output reports/phase1_results.csv
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/phase1_results.csv
          git diff --cached --quiet || git commit -m "Update Phase 1 results"
          git push
      - uses: actions/upload-artifact@v4
        with:
          name: phase1-results
          path: reports/phase1_results.csv
