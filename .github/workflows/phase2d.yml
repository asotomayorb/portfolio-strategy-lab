name: Phase 2D cash floor sensitivity

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/run_phase2d.py"
      - "scripts/run_phase2a.py"
      - "src/data_loader.py"
      - "tickers/**"
      - "portfolio_allocation.csv"
      - "docs/PHASE2D_PROTOCOL.txt"

jobs:
  phase2d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python scripts/run_phase2d.py
      - uses: actions/upload-artifact@v4
        with:
          name: phase2d-cash-floor
          path: reports/phase2d_cash_floor_results.csv
          if-no-files-found: error
          retention-days: 30
