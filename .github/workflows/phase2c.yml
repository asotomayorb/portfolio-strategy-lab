name: Phase 2C deployment speeds

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/run_phase2c.py"
      - "src/data_loader.py"
      - "tickers/**"
      - "portfolio_allocation.csv"
      - "docs/PHASE2C_PROTOCOL.txt"

jobs:
  phase2c:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python scripts/run_phase2c.py
      - uses: actions/upload-artifact@v4
        with:
          name: phase2c-deployment-speeds
          path: reports/phase2c_results.csv
          if-no-files-found: error
          retention-days: 30
