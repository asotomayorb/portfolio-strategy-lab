name: Tiingo market-data coverage

on:
  workflow_dispatch:

jobs:
  coverage:
    runs-on: ubuntu-latest
    env:
      TIINGO_API_KEY: ${{ secrets.TIINGO_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check API secret
        run: |
          if [ -z "$TIINGO_API_KEY" ]; then
            echo "::error::Repository secret TIINGO_API_KEY is not configured."
            exit 2
          fi
      - name: Validate current-price coverage (history is not requested)
        run: python scripts/validate_tiingo_coverage.py
