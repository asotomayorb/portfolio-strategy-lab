name: EODHD split-adjusted OHLC validation

on:
  push:
    paths:
      - "scripts/validate_eodhd_split_adjustment.py"
      - "tests/test_eodhd_split_adjustment.py"
      - ".github/workflows/eodhd-split-adjustment.yml"
  workflow_dispatch:

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test runner
        run: python -m pip install pytest
      - name: Run split-adjustment tests
        run: pytest -q tests/test_eodhd_split_adjustment.py

  authenticated-split-adjustment:
    runs-on: ubuntu-latest
    env:
      EODHD_API_KEY: ${{ secrets.EODHD_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check API secret
        run: |
          if [ -z "$EODHD_API_KEY" ]; then
            echo "::error::Repository secret EODHD_API_KEY is not configured."
            exit 2
          fi
      - name: Validate split-adjusted OHLC
        run: python scripts/validate_eodhd_split_adjustment.py --start-date 2023-01-01
