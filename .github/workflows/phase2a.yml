name: Phase 2A daily ATR engine

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/run_phase2a.py"
      - "src/data_loader.py"
      - "tickers/**"
      - "portfolio_allocation.csv"
      - "docs/PHASE2_PROTOCOL.txt"

jobs:
  phase2a:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python scripts/run_phase2a.py
      - uses: actions/upload-artifact@v4
        with:
          name: phase2a-daily-engine
          path: reports/phase2a_results.csv
          if-no-files-found: error
          retention-days: 30
