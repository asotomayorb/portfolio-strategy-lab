name: Phase 1 history comparison

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  history:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Run common vs expanding comparison
        run: python scripts/run_history_comparison.py --output reports/phase1_history_comparison.csv
      - name: Upload history comparison
        uses: actions/upload-artifact@v4
        with:
          name: phase1-history-comparison
          path: reports/phase1_history_comparison.csv
