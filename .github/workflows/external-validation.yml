name: Phase 1 external-universe validation

on:
  push:
  workflow_dispatch:

jobs:
  external:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Run frozen external-universe validation
        run: python scripts/run_phase1_external_universe.py
      - name: Upload external validation
        uses: actions/upload-artifact@v4
        with:
          name: phase1-external-universe
          path: |
            external_universe_validation_ci.csv
            external_universe_data_coverage_ci.csv
            external_universe_validation_summary.txt
          if-no-files-found: error
          retention-days: 14
