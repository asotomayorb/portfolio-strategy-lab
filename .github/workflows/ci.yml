name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pytest -q --durations=10
      - name: Strategy robustness comparison
        run: python scripts/run_strategy_robustness.py
      - name: Walk-forward robustness validation
        run: python scripts/run_walkforward_robustness.py
      - name: Parameter-neighbor and universe sensitivity
        run: python scripts/run_phase1_sensitivity.py
      - name: Cost and slippage sensitivity
        run: python scripts/run_phase1_cost_sensitivity.py
      - name: External-universe Phase 1 validation
        run: python scripts/run_phase1_external_universe.py
      - name: Statistical uncertainty bootstrap
        run: python scripts/run_phase1_statistical_uncertainty.py
      - name: Upload Phase 1 baseline
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: phase1-results
          path: phase1_results_ci.csv
          if-no-files-found: error
          retention-days: 14
      - name: Upload strategy robustness report
        uses: actions/upload-artifact@v4
        with:
          name: strategy-robustness
          path: |
            strategy_robustness_ci.csv
            strategy_robustness_summary.txt
          retention-days: 14
      - name: Upload walk-forward robustness report
        uses: actions/upload-artifact@v4
        with:
          name: walkforward-robustness
          path: |
            walkforward_robustness_ci.csv
            walkforward_robustness_summary.txt
          retention-days: 14
      - name: Upload Phase 1 sensitivity report
        uses: actions/upload-artifact@v4
        with:
          name: phase1-sensitivity
          path: |
            parameter_neighbor_sensitivity_ci.csv
            universe_sensitivity_ci.csv
            phase1_sensitivity_summary.txt
          retention-days: 14
      - name: Upload Phase 1 cost sensitivity report
        uses: actions/upload-artifact@v4
        with:
          name: phase1-cost-sensitivity
          path: |
            cost_slippage_sensitivity_ci.csv
            cost_slippage_sensitivity_summary.txt
          retention-days: 14
      - name: Upload statistical uncertainty report
        uses: actions/upload-artifact@v4
        with:
          name: phase1-statistical-uncertainty
          path: |
            reports/phase1_statistical_uncertainty.csv
            reports/phase1_statistical_pairwise_cagr.csv
          if-no-files-found: error
          retention-days: 30
      - name: Upload external-universe validation report
        uses: actions/upload-artifact@v4
        with:
          name: phase1-external-universe
          path: |
            external_universe_validation_ci.csv
            external_universe_data_coverage_ci.csv
            external_universe_validation_summary.txt
          if-no-files-found: error
          retention-days: 14
