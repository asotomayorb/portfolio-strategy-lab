name: Phase 1 statistical uncertainty

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/run_phase1_statistical_uncertainty.py"
      - "src/**"
      - "config/**"
      - "tickers/**"

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python scripts/run_phase1_statistical_uncertainty.py
      - name: Upload statistical uncertainty reports
        uses: actions/upload-artifact@v4
        with:
          name: phase1-statistical-uncertainty
          path: |
            reports/phase1_statistical_uncertainty.csv
            reports/phase1_statistical_pairwise_cagr.csv
          if-no-files-found: error
          retention-days: 30
